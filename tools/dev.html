<!doctype html>
<html><head><meta charset="utf-8"><title>Dev harness</title>
<style>html,body{margin:0;height:100%;background:#111}canvas{width:100%;height:100%;display:block}#info{position:fixed;left:8px;top:8px;color:#9f9;font:12px monospace}</style></head>
<body><canvas id="c"></canvas><div id="info"></div>
<script type="module">
import { Renderer, Scene, Camera, Node, mat4, Mesh, Material, buildShape } from '../engine/index.js';
import { ViewModel } from '../src/content/viewmodel.js';
const q = new URLSearchParams(location.search);
const renderer = new Renderer(document.getElementById('c'), { pixelRatio: 1 });
const scene = new Scene();
const env = scene.environment;
Object.assign(env, { mesas: false, sunIntensity: 2.0, ambient: 0.6, fogDensity: 0.0, exposure: 1.1 });
const floor = new Mesh(buildShape({ type: 'box', width: 20, height: 0.1, depth: 20, bevel: 0 }), new Material({ color: '#555', pattern: 'concrete', patternScale: 1, worldPattern: true, roughness: 0.8 }));
floor.position.set([0, -0.05, 0]); scene.add(floor);
const view = q.get('view') || 'vm';
const camera = new Camera(); camera.fov = 70 * Math.PI / 180;
window.__ready = false;
if (view === 'vm') {
  const vm = new ViewModel();
  const rig = vm.equip(q.get('gun') || 'm4a1');
  const root = new Node('vm'); root.add(rig.ch);
  const eye = [0, 1.6, 0];
  root.position.set(eye);
  root.rotation.set([0, 0, 0, 1]);
  scene.add(root);
  const cam = q.get('cam') || 'eye';
  if (cam === 'eye') { camera.position.set(eye); camera.target.set([0, 1.6, 1]); camera.near = 0.01; }
  else if (cam === 'side') { camera.position.set([-1.1, 1.55, 0.2]); camera.target.set([0, 1.45, 0.2]); camera.near = 0.01; camera.fov = 35 * Math.PI / 180; }
  else if (cam === 'top') { camera.position.set([0.0, 2.6, 0.25]); camera.target.set([0, 1.4, 0.26]); camera.up.set([0, 0, 1]); camera.near = 0.01; camera.fov = 40 * Math.PI / 180; }
  else if (cam === 'front') { camera.position.set([-0.4, 1.5, 1.4]); camera.target.set([0, 1.45, 0.2]); camera.near = 0.01; camera.fov = 35 * Math.PI / 180; }
  const input = { ads: q.get('ads') === '1', sprint: q.get('sprint') === '1', speed: 0, grounded: true, look: [0, 0] };
  const act = q.get('action'); const at = parseFloat(q.get('t') || '0');
  if (act) vm.play(act, {});
  // step to time
  let steps = act ? Math.round((at * (vm.action?.dur || 1)) / (1 / 60)) : 30;
  for (let i = 0; i < steps; i++) vm.update(1 / 60, input);
  if (act) vm.action = null, vm.update(0, input);
  // freeze an action at t: replay manually
  if (act) { vm.play(act, {}); const d = vm.action.dur; for (let i = 0; i < 10; i++) vm.update(0, input); vm.action.t = at * d - 1e-4; vm.update(0.0001, input); }
  if (q.get('fire')) { vm.fire(); vm.update(0.02, input); }
  rig.ch.updateWorld(root.world);
  let n = 0; const loop = () => { renderer.render(scene, camera, { fog: false }); if (++n < 3) requestAnimationFrame(loop); else window.__ready = true; };
  loop();
}

if (view === 'chars') {
  const H = await import('../src/content/humans.js');
  const Pr = await import('../src/content/props.js');
  const { attachToBone } = await import('../src/util.js');
  const list = [
    H.createOperator({ name: 'Reyes', gear: 'nvg', beard: true }),
    H.createOperator({ name: 'Volkova', gear: 'mask', skin: '#d9a88a' }),
    H.createOperator({ name: 'Okafor', gear: 'goggles', skin: '#6b4430' }),
    H.createClassD({ hair: 'buzz', skin: '#8a5a3c' }),
    H.createClassD({ hair: 'short', skin: '#d8a484', bloody: true }),
  ];
  const clip = q.get('clip') || 'Idle';
  const guns = [];
  list.forEach((c, i) => { c.position.set([(i - 2) * 0.9, 0, 0]); scene.add(c); c.play(clip, { fade: 0 }); });
  const s173 = Pr.createSCP173(); s173.position.set([2.8, 0, -0.6]); scene.add(s173);
  if (q.get('heli')) { const h = Pr.createHelicopter(); h.position.set([0, 0.8, -8]); scene.add(h); }
  const gunIds = ['m4a1', 'm1014', 'm110', 'glock', null];
  list.forEach((c, i) => { if (gunIds[i]) { const g = Pr.npcWeapon(gunIds[i]); scene.add(g); guns.push([c, g, gunIds[i]]); } });
  camera.position.set(JSON.parse(q.get('cp') || '[0.5,1.5,4.2]')); camera.target.set(JSON.parse(q.get('ct') || '[0.4,1.0,0]')); camera.fov = 45 * Math.PI / 180;
  const T = parseFloat(q.get('t') || '0.3');
  for (const c of list) { c.update(T); }
  scene.updateWorld();
  for (const [c, g, id] of guns) {
    const m = H.applyAim(c, id, { mode: q.get('mode') || 'aim' });
    c.updateWorld();
    const { mat4 } = await import('../engine/index.js');
    g.worldOverride = mat4.multiply(mat4.create(), c.world, m);
  }
  env.sunDirection = [0.4, 0.8, 0.6];
  let n = 0; const loop = () => { renderer.render(scene, camera, { fog: false }); if (++n < 3) requestAnimationFrame(loop); else window.__ready = true; };
  loop();
}
</script></body></html>
